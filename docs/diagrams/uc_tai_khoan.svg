<text x="1210.0" y="462.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D" font-weight="bold">Admin</text>
<text x="470.0" y="85.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Xem danh sách, tìm kiếm, lọc</text>
<text x="470.0" y="165.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Duyệt đăng ký</text>
<text x="470.0" y="245.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Từ chối đăng ký</text>
<text x="470.0" y="325.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Thêm tài khoản nhân viên</text>
<text x="470.0" y="405.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Sửa thông tin tài khoản</text>
<text x="470.0" y="485.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Khóa / Mở khóa</text>
<text x="470.0" y="565.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Xem lịch sử trạng thái</text>
<text x="470.0" y="637.1" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Tạm dừng / Kích hoạt lại</text>
<text x="470.0" y="652.9" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">(nghỉ ốm, thai sản...)</text>
<text x="470.0" y="733.0" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1F2D3D">Xóa tài khoản (chọn lý do)</text>
